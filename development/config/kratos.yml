version: v0.13.0

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allow_credentials: true
      allowed_origins:
        - http://127.0.0.1:4433
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Content-type
        - Authorization
  admin:
    base_url: http://127.0.0.1:4434/

oauth2_provider:
  url: http://127.0.0.1:4445

selfservice:
  default_browser_return_url: http://127.0.0.1:8080/
  allowed_return_urls:
    - http://127.0.0.1:8080
    - http://127.0.0.1:8080/
    - http://127.0.0.1:8080/oauth2/login
    - http://127.0.0.1:8080/oauth2/login/
    - http://127.0.0.1:8080/oauth2/consent
    - http://127.0.0.1:8080/oauth2/consent/
    - http://127.0.0.1:8080/logout

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
    totp:
      config:
        issuer: Kratos
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:8080/error

    settings:
      ui_url: http://127.0.0.1:8080/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://127.0.0.1:8080/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://127.0.0.1:8080/verification
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:8080/

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:8080/login

    login:
      ui_url: http://127.0.0.1:8080/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: http://127.0.0.1:8080/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

feature_flags:
  use_continue_with_transitions: true

secrets:
  cookie:
    - "q6e84t8g1vv5b16n4n89u4i65k46o841"
  cipher:
    - "q6e84t8g1vv5b16n4n89u4i65k46o842"